<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marciano & Marta</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#f5f0eb}
body{overflow:hidden}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:#f8f4ef}
#book{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .55s ease}
.page.active{opacity:1;pointer-events:auto}
.art{position:relative;width:min(100vw,56.28dvh);aspect-ratio:941/1672;max-height:100dvh}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;background:#f8f4ef}
.guest{position:absolute;left:50%;top:36.5%;width:78%;transform:translate(-50%,-50%);text-align:center;color:#8b1738;font-family:Georgia,"Times New Roman",serif;font-size:clamp(14px,3.4vw,26px);line-height:1.1;font-weight:700;letter-spacing:.065em;text-transform:uppercase;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .45s ease}
.page.active .guest{opacity:1}
.ui-top{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px}
.dot{width:7px;height:7px;border:0;border-radius:20px;background:rgba(112,45,52,.22);padding:0;transition:.3s;cursor:pointer}
.dot.active{width:22px;background:#8b1738}
.ui-bottom{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px}
.btn{height:44px;min-width:44px;border:1px solid rgba(255,255,255,.8);border-radius:999px;background:rgba(255,250,246,.8);color:#751331;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 20px rgba(60,30,25,.12);backdrop-filter:blur(8px);cursor:pointer}
.next{padding:0 17px;gap:8px;font:600 11px system-ui,sans-serif}
.swipe{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:10;color:rgba(117,19,49,.28);pointer-events:none}
@media(max-width:640px){
 #app{height:100dvh}
 .art{width:min(100vw,calc(100dvh * .5628));height:auto}
}
@media(prefers-reduced-motion:reduce){.page{transition:none}}
</style>
<script>window.CONVITE_IMAGES=__CONVITE_IMAGES_JSON__;</script>
</head>
<body>
<main id="app" aria-label="Convite de casamento Marciano e Marta">
  <div id="book">
    <section class="page active"><div class="art"><img alt="Marciano e Marta" decoding="async"></div></section>
    <section class="page"><div class="art"><img alt="Escritura" decoding="async"></div></section>
    <section class="page"><div class="art"><img alt="Convite personalizado" decoding="async"><div class="guest">Convidado</div></div></section>
    <section class="page"><div class="art"><img alt="Programa da celebração" decoding="async"></div></section>
    <section class="page"><div class="art"><img alt="Presença" decoding="async"></div></section>
  </div>
  <div class="ui-top" id="dots" aria-label="Páginas"></div>
  <div class="swipe"><i data-lucide="chevron-right" style="width:18px;height:18px"></i></div>
  <div class="ui-bottom">
    <button class="btn" id="prev" type="button" aria-label="Página anterior"><i data-lucide="chevron-left"></i></button>
    <button class="btn next" id="next" type="button"><span id="nextLabel">Continuar</span><i data-lucide="arrow-right"></i></button>
  </div>
</main>
<script>
const IMAGES=window.CONVITE_IMAGES||[];
const pages=[...document.querySelectorAll('.page')];
const dots=document.getElementById('dots');
const prev=document.getElementById('prev');
const next=document.getElementById('next');
const nextLabel=document.getElementById('nextLabel');
let index=0;

pages.forEach((p,i)=>{const img=p.querySelector('img');if(img&&IMAGES[i])img.src=IMAGES[i];});

IMAGES.forEach((_,i)=>{
  const b=document.createElement('button');
  b.className='dot'+(i===0?' active':'');
  b.type='button';
  b.setAttribute('aria-label','Ir para a fase '+(i+1));
  b.addEventListener('click',()=>go(i));
  dots.appendChild(b);
});

function render(){
  pages.forEach((p,i)=>p.classList.toggle('active',i===index));
  [...dots.children].forEach((d,i)=>d.classList.toggle('active',i===index));
  nextLabel.textContent=index===pages.length-1?'Recomeçar':'Continuar';
  prev.style.opacity=index===0?'.35':'1';
}
function go(n){index=(n+pages.length)%pages.length;render();}
function forward(){go(index===pages.length-1?0:index+1);}
prev.addEventListener('click',()=>{if(index>0)go(index-1)});
next.addEventListener('click',forward);

let downX=0,downY=0;
document.getElementById('app').addEventListener('touchstart',e=>{
  const t=e.changedTouches[0];downX=t.clientX;downY=t.clientY;
},{passive:true});
document.getElementById('app').addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-downX,dy=t.clientY-downY;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){
    if(dx<0)forward();else if(index>0)go(index-1);
  }
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')forward();
  if(e.key==='ArrowLeft'&&index>0)go(index-1);
});
if(typeof lucide!=='undefined')lucide.createIcons();
render();
</script>
</body>
</html>
